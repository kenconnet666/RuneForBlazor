# 持续集成：每次推送与 PR 都在 Linux、Windows 上构建并运行全部测试，并检查生成的样式属性表与数据源一致。
name: CI

on:
  push:
    branches: [master, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

# 同一分支有新的推送时取消还在跑的旧任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # css-gen、theme-gen 的数据来源：生成 Style.Properties.g.cs、Themes.g.cs 时 vue-tsx-pro 的版本。重新生成时一起更新这里
  VUE_TSX_PRO_REF: 7c4e61da2874fc00bfc9c79e9e59c5123ed608a5

jobs:
  build-test:
    name: 构建与测试（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        # 开发在 Windows 上，部署通常在 Linux 上：两边都跑
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: 安装 .NET SDK（版本取自 global.json）
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: 缓存 NuGet 包
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 还原
        run: dotnet restore RuneForBlazor.slnx

      - name: 构建（警告即错误）
        run: dotnet build RuneForBlazor.slnx --configuration Release --no-restore

      - name: 测试
        run: dotnet test --project tests/Rune.Tests/Rune.Tests.csproj --configuration Release --no-build

      # 只在 Linux 上打包一次：检查生成器在 Rune 包里（安装 Rune 就能用 [State]）、浮层的 JS 初始化器在 Rune.UI 包里，包作为产物留存
      - name: 打包并检查包的内容
        if: runner.os == 'Linux'
        run: |
          dotnet pack src/Rune/Rune.csproj --configuration Release --no-build --output artifacts
          dotnet pack src/Rune.UI/Rune.UI.csproj --configuration Release --no-build --output artifacts
          dotnet pack src/Rune.Icons/Rune.Icons.csproj --configuration Release --no-build --output artifacts
          unzip -l "$(ls artifacts/Rune.[0-9]*.nupkg)" | grep -q "analyzers/dotnet/cs/Rune.Generators.dll"
          unzip -l "$(ls artifacts/Rune.Icons.[0-9]*.nupkg)" | grep -q "LICENSE-lucide.txt"
          unzip -l "$(ls artifacts/Rune.UI.[0-9]*.nupkg)" | grep -q "Rune.UI.*lib.module.js"

      - name: 上传包
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/*

  icon-gen:
    name: 图标数据与 Lucide 一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # 脚本用 npm pack 下载 lucide-static（版本写在脚本里）
      - name: 检查 Lucide.g.cs、BuiltInIcons.g.cs 与许可文件
        run: node tools/icon-gen/generate.mjs --check

  css-gen:
    name: 样式属性表、内置主题与 vue-tsx-pro 一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 取 vue-tsx-pro 的 CSS 数据
        uses: actions/checkout@v7
        with:
          repository: kenconnet666/vue-tsx-pro
          ref: ${{ env.VUE_TSX_PRO_REF }}
          path: .deps/vue-tsx-pro
          sparse-checkout: |
            packages/tsx/src/styles
            packages/ui/src/config/theme

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 检查 Style.Properties.g.cs
        run: node tools/css-gen/generate.mjs --check --source .deps/vue-tsx-pro

      - name: 检查 Themes.g.cs
        run: node tools/theme-gen/generate.mjs --check --source .deps/vue-tsx-pro
