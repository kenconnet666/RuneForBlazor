# 持续集成：每次推送与 PR 都在 Linux、Windows 上构建并运行单元测试，Linux 上另跑端到端测试，并检查生成的样式属性表与数据源一致。
# 单元测试、端到端测试与几个生成检查是并行的任务：各自构建，互不等待（端到端最慢，不拖住其余结果）。
name: CI

on:
  push:
    branches: [master, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      update-visual-baselines:
        description: 重新截截图基线（作为构件 visual-baselines 上传，看过后放进 tests/Rune.E2E/Visual/Baselines 提交）
        type: boolean
        default: false

# 同一分支有新的推送时取消还在跑的旧任务；手动运行（如更新截图基线）单独一组，不被推送取消
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # css-gen、theme-gen、lang-gen 的数据来源：生成 Style.Properties.g.cs、Themes.g.cs 时 vue-tsx-pro 的版本。重新生成时一起更新这里
  VUE_TSX_PRO_REF: c42b2f396b0f45d2d937eb91fb91ac17459da294

jobs:
  build-test:
    name: 构建与单元测试（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        # 开发在 Windows 上，部署通常在 Linux 上：两边都跑
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: 安装 .NET SDK（版本取自 global.json）
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: 缓存 NuGet 包
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 还原
        run: dotnet restore RuneForBlazor.slnx

      - name: 构建（警告即错误）
        run: dotnet build RuneForBlazor.slnx --configuration Release --no-restore

      - name: 单元测试
        run: dotnet test --project tests/Rune.Tests/Rune.Tests.csproj --configuration Release --no-build

      # 只在 Linux 上打包一次：检查包的内容（生成器在核心包里、JS 初始化器与许可文件在该在的包里，见脚本），包作为产物留存
      - name: 打包并检查包的内容
        if: runner.os == 'Linux'
        run: bash tools/pack/pack.sh artifacts

      - name: 上传包
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/*

  # 端到端测试只在 Linux 上跑：只构建要用的演示项目与测试项目，装 Chromium 与它要的系统库，再启动演示项目逐个操作页面
  e2e:
    name: 端到端测试（${{ matrix.letters }}）
    runs-on: ubuntu-latest
    # 全部用例本地约 3 分钟；卡住时不占着 runner 等默认的 6 小时
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # 按测试类名的首字母分四段并行（各段内各测试类也并行）：段是字母区间，合起来正好 A–Z，以后新加的类自然落进某一段。
      # 区间按各段在 CI 上的用时划分（FocusRingTests 逐页查全部文档页，最重，单独在 E–H），某段明显变慢时再调
      matrix:
        letters: [A-D, E-H, I-R, S-Z]
    steps:
      - uses: actions/checkout@v7

      - name: 安装 .NET SDK（版本取自 global.json）
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: 缓存 NuGet 包
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 构建（警告即错误）
        run: dotnet build tests/Rune.E2E/Rune.E2E.csproj --configuration Release

      - name: 安装 Playwright 的 Chromium
        run: pwsh tests/Rune.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # 截图基线（VisualTests*）由下面的 visual 任务跑
      - name: 端到端测试
        env:
          LETTERS: ${{ matrix.letters }}
        run: |
          filters=()
          for letter in $(eval echo "{${LETTERS/-/..}}"); do filters+=(--filter-class "Rune.E2E.$letter*"); done
          dotnet test --project tests/Rune.E2E/Rune.E2E.csproj --configuration Release --no-build "${filters[@]}" --filter-not-class 'Rune.E2E.VisualTests*'

  # 截图基线：每个文档页示例的效果区与 tests/Rune.E2E/Visual/Baselines 比较（页面分给几个测试类并行截，见 VisualTests）。系统、浏览器、字体都固定（ubuntu-24.04、Playwright 的 Chromium），
  # “现在”也固定（VisualServer）。不一致时实际的截图作为构件 visual-failures 上传
  visual:
    name: 截图基线
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: 安装 .NET SDK（版本取自 global.json）
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: 缓存 NuGet 包
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 构建（警告即错误）
        run: dotnet build tests/Rune.E2E/Rune.E2E.csproj --configuration Release

      - name: 安装 Playwright 的 Chromium
        run: pwsh tests/Rune.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: 截图比较
        run: dotnet test --project tests/Rune.E2E/Rune.E2E.csproj --configuration Release --no-build --filter-class 'Rune.E2E.VisualTests*'
        env:
          RUNE_VISUAL_UPDATE: ${{ inputs.update-visual-baselines && '1' || '' }}

      - name: 上传新的基线
        if: inputs.update-visual-baselines
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: tests/Rune.E2E/Visual/Baselines

      - name: 上传不一致的截图
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-failures
          path: artifacts/visual

  # 桌面（.NET MAUI，Windows）：MAUI 的项目要装 maui-windows 工作负载，不在 slnx 里，这里单独构建适配包与桌面样板，
  # 再运行样板的自检（RUNE_DESKTOP_SELFCHECK）：标题栏是拖动区域、窗口按钮能最大化与还原、第一屏内容出来时样式已经在了、
  # 每个分类第一页打开与展开浮层都没有错误
  desktop:
    name: 桌面（MAUI，Windows）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: 安装 .NET SDK（版本取自 global.json）
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: 缓存 NuGet 包
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-maui-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-maui-

      - name: 安装 maui-windows 工作负载
        run: dotnet workload install maui-windows

      - name: 构建适配包与桌面样板（警告即错误）
        run: dotnet build apps/Rune.Desktop/Rune.Desktop.csproj --configuration Release

      - name: 自检
        shell: pwsh
        env:
          RUNE_DESKTOP_SELFCHECK: ${{ runner.temp }}\selfcheck.txt
          RUNE_DESKTOP_SELFCHECK_QUICK: '1'
        run: |
          $exe = Get-ChildItem apps/Rune.Desktop/bin/Release -Recurse -Filter Rune.Desktop.exe | Select-Object -First 1
          $app = Start-Process $exe.FullName -PassThru
          if (-not $app.WaitForExit(300000)) { $app.Kill(); throw '自检超时' }
          $report = Get-Content $env:RUNE_DESKTOP_SELFCHECK
          $report
          if (-not ($report -match '^titlebar\theader=drag ')) { throw '顶栏不是拖动区域' }
          if (-not ($report -match '^maximize\tafter click=还原 after second click=最大化$')) { throw '窗口按钮没有最大化、还原窗口' }
          if ($report -match 'errors=[1-9]') { throw '有页面报错' }
          if (-not ($report -match '^first content\tstyled$')) { throw '第一屏先出现了没有样式的内容' }
          if (-not ($report -match '^cursors\tgrab=pointer grabbing=pointer$')) { throw '抓手光标没有换成系统的手形（WinUI 的 WebView2 不认 grab）' }

  icon-gen:
    name: 图标数据、第三方脚本与上游一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # 脚本用 npm pack 下载 lucide-static（版本写在脚本里）
      - name: 检查 Lucide.g.cs、BuiltInIcons.g.cs 与许可文件
        run: node tools/icon-gen/generate.mjs --check

      # 浮层定位用的 Floating UI（版本写在脚本里），同样用 npm pack 下载比对
      - name: 检查 wwwroot/vendor 里的第三方脚本
        run: node tools/vendor-gen/generate.mjs --check

  css-gen:
    name: 样式属性表、内置主题、语言包与 vue-tsx-pro 一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 取 vue-tsx-pro 的 CSS 数据
        uses: actions/checkout@v7
        with:
          repository: kenconnet666/vue-tsx-pro
          ref: ${{ env.VUE_TSX_PRO_REF }}
          path: .deps/vue-tsx-pro
          # patterns、docs-kit 里有页面级组件自带的文案表（messages.ts，lang-gen 生成 PatternsMessages、DocsKitMessages）
          sparse-checkout: |
            packages/tsx/src/styles
            packages/ui/src/config/theme
            packages/ui/src/config/lang
            packages/ui/src/patterns
            packages/ui/src/docs-kit
            packages/ui/src/area

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 检查 Style.Properties.g.cs
        run: node tools/css-gen/generate.mjs --check --source .deps/vue-tsx-pro

      - name: 检查 Themes.g.cs
        run: node tools/theme-gen/generate.mjs --check --source .deps/vue-tsx-pro

      - name: 检查 Lang.g.cs
        run: node tools/lang-gen/generate.mjs --check --source .deps/vue-tsx-pro

      - name: 检查省市区数据（Rune.UI.Area）
        run: node tools/area-gen/generate.mjs --check --source .deps/vue-tsx-pro
