# 发布到 nuget.org：推送 v 开头的 tag（如 v0.12.0、v0.13.0-rc.1）时运行。
#   1. tag 的版本要与 Directory.Build.props 的 VersionPrefix 一致（预览版 tag 只比较 - 之前的部分），CHANGELOG.md 里要有这个版本的一节；
#   2. 等这个提交在 master 上的 CI 跑完并全部通过（含端到端测试与截图基线），没通过就不发；
#   3. 按 tag 的版本打包（tools/pack/pack.sh，与 CI 同一套检查；MAUI 的适配包 RuneForBlazor.Desktop.Maui 只能在 Windows 上打，另一个任务打好交过来），
#      用 nuget.org 的可信发布（Trusted Publishing）换一次性 API key 推送，不存长期密钥；
#   4. 在 GitHub 建 Release，说明取 CHANGELOG.md 里这个版本的一节，附上包。
# nuget.org 上的策略锁定了这个仓库、这个文件名（release.yml）与环境 release；环境只允许 v* tag 部署。
# 版本号发布后不能复用、包也删不掉（只能 unlist）：CI 没过时删掉 tag、修好后重打即可，nuget.org 上不会留下东西。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  # MAUI 的适配包：要 maui-windows 工作负载，只能在 Windows 上打包；它依赖的 RuneForBlazor.UI 同一个版本由下面的任务推送
  desktop:
    name: Pack RuneForBlazor.Desktop.Maui
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-windows
      - name: Pack
        shell: bash
        run: dotnet pack src/Rune.Desktop.Maui/Rune.Desktop.Maui.csproj --configuration Release --output artifacts/desktop -p:Version="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-package
          path: artifacts/desktop/*

  release:
    name: Publish ${{ github.ref_name }}
    needs: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    permissions:
      contents: write   # 建 GitHub Release
      actions: read     # 查 CI 的结果
      id-token: write   # 可信发布：向 GitHub 要 OIDC 令牌
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check version
        run: |
          version="${GITHUB_REF_NAME#v}"
          prefix=$(dotnet msbuild src/Rune/Rune.csproj -getProperty:VersionPrefix)
          if [[ "${version%%-*}" != "$prefix" ]]; then
            echo "::error::tag $GITHUB_REF_NAME 与 Directory.Build.props 的 VersionPrefix $prefix 不一致"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 里没有 ## [$version] 一节"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # tag 指向的提交必须先在 master 上推过、CI 全部通过；CI 还在跑就等它
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 100); do
            run=$(gh run list --workflow CI --branch master --commit "$GITHUB_SHA" --event push --limit 1 --json status,conclusion,url --jq '.[0] // empty')
            if [[ -z "$run" ]]; then
              echo "::error::这个提交在 master 上没有 CI 运行：先把它推到 master，再打 tag"
              exit 1
            fi
            if [[ $(jq -r .status <<<"$run") == completed ]]; then
              conclusion=$(jq -r .conclusion <<<"$run")
              echo "CI: $conclusion $(jq -r .url <<<"$run")"
              [[ $conclusion == success ]] && exit 0
              echo "::error::CI 没有通过，不发布"
              exit 1
            fi
            sleep 60
          done
          echo "::error::等 CI 超时"
          exit 1

      - name: Build
        run: dotnet build RuneForBlazor.slnx --configuration Release -p:Version="$VERSION"

      - name: Pack
        run: bash tools/pack/pack.sh artifacts/packages "$VERSION"

      - name: 取 Windows 上打好的适配包
        uses: actions/download-artifact@v7
        with:
          name: desktop-package
          path: artifacts/packages

      # 换到的 API key 只有 1 小时有效：放在推送前一步，不在等 CI 之前登录
      - name: NuGet login (Trusted Publishing)
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # 同目录下的 .snupkg 随 .nupkg 一起推送；--skip-duplicate 让重跑这个任务时跳过已经发上去的包
      - name: Push to nuget.org
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 这个版本的一节：从 "## [版本]" 的下一行到下一个 "## [" 或文末的链接定义之前
          awk -v head="## [$VERSION]" 'index($0, head) == 1 {on=1; next} index($0, "## [") == 1 || index($0, "[") == 1 && index($0, "]: ") > 0 {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          prerelease=$([[ $VERSION == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" artifacts/packages/* --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" $prerelease
